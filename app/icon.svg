  <path fill="#fff" fill-rule="evenodd" d="
    M50 25 C30 25 17 32 17 50 C17 68 30 75 50 75 C70 75 83 68 83 50 C83 32 70 25 50 25 Z
    M50 37.4 C36 37.4 29.2 41 29.2 50 C29.2 59 36 62.6 50 62.6 C64 62.6 70.8 59 70.8 50 C70.8 41 64 37.4 50 37.4 Z"/>
  <!-- slit separating the upper arm from the crossbar -->
  <rect x="48" y="43" width="42" height="2.9" fill="#7C4A9E"/>
  <!-- crossbar, flush with the letter's right edge, soft left foot -->
  <path fill="#fff" d="M48 45.9 H83 V58.5 H55.5 C50.8 58.5 48 56.3 48 52.3 Z"/>
</svg>
